# 由 attachmenttoolarge 维护。三条自检流水线 + 跨平台打包 + tag 自动发 Release。
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------- 1. 命令行工具的单元/集成自检 ----------
  cli-test:
    name: att CLI 自检 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 三个平台都跑一遍：分片／重组是字节级操作，值得跨平台确认
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 跑 CLI 自检（41 项）
        run: node tools/cli-test.mjs

  # ---------- 2. 浏览器端自检（Windows runner 自带 Edge） ----------
  browser-test:
    name: 浏览器自检（CDP 驱动无头 Edge）
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 全部页面 × 桌面/移动视口
        run: node tools/browser-check.mjs 全部

  # ---------- 3. 注册后端自检 ----------
  server-test:
    name: 注册后端自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 注册／登录／会话／CSRF／限流／退会
        run: node tools/server-test.mjs

  # ---------- 4. 打包单文件可执行程序 ----------
  build-exe:
    name: 打包 att (${{ matrix.asset }})
    needs: [cli-test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: att-win-x64.exe
          - os: ubuntu-latest
            asset: att-linux-x64
          - os: macos-latest
            asset: att-macos-arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 构建（含产物自检：真跑一遍 exe 的分片与重组）
        run: node tools/build-exe.mjs --out dist/${{ matrix.asset }}
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # ---------- 5. 打 tag 时自动发 Release ----------
  release:
    name: 发布 Release
    needs: [build-exe, browser-test, server-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 汇总各平台产物
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: 生成校验和
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt || true
          ls -la
      - name: 创建 Release 并附上可执行文件
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "attachmenttoolarge ${GITHUB_REF_NAME}" \
            --notes "附件过大组织命令行工具。下载对应平台的文件即可使用，无需安装 Node。

          - \`att-win-x64.exe\` — Windows 64 位
          - \`att-linux-x64\` — Linux x64
          - \`att-macos-arm64\` — macOS Apple Silicon

          用法：
          \`\`\`
          att info  \"某个大文件.xlsx\"        # 发得出去吗（含 Base64 膨胀复算）
          att split \"某个大文件.xlsx\" --limit 20MB
          att join  \"某个大文件.xlsx.att.json\"
          att ndr   退信.txt
          \`\`\`
          校验和见 \`SHA256SUMS.txt\`。" \
            dist/*
